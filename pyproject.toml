[project]
name = "edumark"
version = "0.1.0"
description = "基于大模型的中小学作业批改系统"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Redis & Celery
    "redis>=5.1.0",
    "celery>=5.4.0",

    # Image processing
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",

    # Object storage
    "minio>=7.2.0",

    # Vector DB
    "qdrant-client>=1.11.0",

    # HTTP client
    "httpx>=0.27.0",

    # Config & env
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Data validation
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"